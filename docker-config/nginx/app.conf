# X-Request-Id: varsa geleni kullan, yoksa nginx'in $request_id'sini üret
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name otel.iesoft.net;

    resolver 127.0.0.11 valid=10s ipv6=off;

    root /var/www/public;
    index index.php;

    # Logs -> Docker stdout/stderr
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Upload limit: 20MB
    client_max_body_size 20m;

    # Response header olarak geri döndür (debug kolaylığı)
    add_header X-Request-Id $req_id always;

    # Güvenlik başlıkları
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Dotfiles kapat (/.env, /.git, vs) + well-known hariç
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Yayınlanmaması gereken tipik dosyalar
    location ~* \.(?:env|log|sql|bak|ini|conf)$ {
        deny all;
    }

    location ^~ /livewire/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Storage
    location ^~ /storage/ {
        alias /var/www/storage/app/public/;
        try_files $uri $uri/ =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Static dosyalar: cache + 404
    location ~* \.(?:css|js|mjs|map|jpg|jpeg|gif|png|svg|ico|webp|ttf|otf|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi.conf;

        fastcgi_pass app:9000;

        fastcgi_param HTTP_X_REQUEST_ID $req_id;
        fastcgi_param REQUEST_ID $req_id;

        fastcgi_read_timeout 60s;
    }
}
