services:
  # Laravel Uygulaması
  app:
    build:
      context: .
      dockerfile: docker-config/app/Dockerfile
    container_name: otel-app
    restart: unless-stopped
    working_dir: /var/www/
    volumes:
      - ./:/var/www
      - ./docker-config/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./docker-config/php/www.conf:/usr/local/etc/php-fpm.d/www.conf
    depends_on:
      - db
    networks:
      - app-network

  # Nginx Web Sunucusu
  webserver:
    image: nginx:alpine
    container_name: otel-web
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - ./:/var/www
      - ./docker-config/nginx/app.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-network
      - lemp_net

  # MySQL Veritabanı
  db:
    image: mysql:8.0
    container_name: otel-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysqldata:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - app-network

  # Redis (Cache ve Queue için)
  redis:
    image: redis:alpine
    container_name: otel-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
  lemp_net:
    external: true

volumes:
  mysqldata:
